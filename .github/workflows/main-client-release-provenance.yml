name: Main client release provenance

on:
  workflow_dispatch:
    inputs:
      release:
        description: Approved Main release manifest ID
        required: true
        default: 0.0.0-phase1vs.local
        type: string
      apply:
        description: Prepare isolated client upgrade branches
        required: true
        default: false
        type: boolean
      push:
        description: Push branches and request controlled client PRs
        required: true
        default: false
        type: boolean
      apply_db:
        description: Apply approved pending Main migrations through Supabase
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install Main dependencies
        run: npm ci --ignore-scripts

      - name: Clone registered clients for isolated preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/clients"
          node <<'NODE' >"${RUNNER_TEMP}/client-repositories.txt"
          const registry = require('./ops/clients.json');
          for (const client of registry.clients.filter((entry) => entry.lifecycleStatus === 'ACTIVE' && entry.rolloutStatus !== 'DISABLED')) {
            console.log(`${client.clientId}\t${client.repositoryReference.replace(/^github:/, '')}`);
          }
          NODE
          while IFS=$'\t' read -r client_id repository; do
            gh repo clone "${repository}" "${RUNNER_TEMP}/clients/${client_id}"
          done <"${RUNNER_TEMP}/client-repositories.txt"

      - name: Run Main-to-client provenance preflight
        env:
          APPLY_RELEASE: ${{ inputs.apply }}
          PUSH_RELEASE: ${{ inputs.push }}
          APPLY_DB: ${{ inputs.apply_db }}
        run: |
          set -euo pipefail
          args=(--release "${{ inputs.release }}" --workspace "${RUNNER_TEMP}/clients" --clone --output "${RUNNER_TEMP}/release-rollout.json")
          if [[ "${APPLY_RELEASE}" == "true" ]]; then args+=(--apply); fi
          if [[ "${PUSH_RELEASE}" == "true" ]]; then args+=(--push); fi
          if [[ "${APPLY_DB}" == "true" ]]; then args+=(--apply-db); fi
          npm run release:promote -- "${args[@]}"

      - name: Publish rollout audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradesstack-release-rollout-${{ inputs.release }}
          path: ${{ runner.temp }}/release-rollout.json
          if-no-files-found: ignore
