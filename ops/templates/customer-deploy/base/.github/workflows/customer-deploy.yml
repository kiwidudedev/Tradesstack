name: Customer Cloudflare deploy

# Manual, approval-gated deployment. Configure the repository secrets before
# running. The preflight validates deploy/customer.json and refuses Alpha/Main
# identities.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: corepack enable
      - run: corepack npm ci --ignore-scripts
      - run: corepack npm run cloudflare:deploy
